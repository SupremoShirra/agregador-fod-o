<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <title>Bancada</title>
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <header class="top">
    <a class="logo" href="#/">Bancada</a>
    <nav class="nav">
      <a href="#/novidades">Novidades</a>
      <a href="#/sobre">Sobre nós</a>
      <a href="#/docs">Documentação</a>
      <a href="#/mod" id="modLink" hidden>Moderação</a>
    </nav>
    <div id="session" class="session"></div>
  </header>
  <main id="view"></main>

  <dialog id="authDlg">
    <form id="authForm">
      <h2 id="authTitle">Entrar</h2>
      <label>Nome de usuário
        <input name="username" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" autocomplete="username">
      </label>
      <label>Senha
        <input name="password" type="password" required minlength="8" maxlength="72">
      </label>
      <p id="authHint" class="hint"></p>
      <p id="authError" class="error" role="alert"></p>
      <div class="row">
        <button type="button" class="btn ghost" id="authSwitch"></button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancelar</button>
        <button type="submit" class="btn solid" id="authSubmit">Entrar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
